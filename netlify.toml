# Production branch must be `main` in Netlify:
# Project configuration → Build & deploy → Continuous deployment → Production branch.
# netlify.toml cannot set that UI field; the ignore command below is the repo-side lock.

[build]
  command = "npm run build"
  ignore = 'if [ "$CONTEXT" = "production" ] && [ "$BRANCH" != "main" ]; then echo "Skipping production deploy from $BRANCH (locked to main)"; exit 0; fi; exit 1'

