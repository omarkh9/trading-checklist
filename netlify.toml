[context.production]
  command = "npm run build"

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://edge-log-11.netlify.app"

# Pull-request Deploy Previews. No extra build command needed.
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://edge-log-11.netlify.app"

# Feature-branch deploys (cursor/*, etc.) stay on *.netlify.app preview URLs.
# They never replace production unless the UI production branch is changed.
[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "https://edge-log-11.netlify.app"

[context.dev.environment]
  NEXT_PUBLIC_SITE_URL = "https://edge-log-11.netlify.app"

[dev]
  command = "npm run dev"
  targetPort = 3001
  framework = "next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
